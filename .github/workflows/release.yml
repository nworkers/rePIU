name: Release

# Task 434: verifies a tag and publishes its artifacts.
#
# Everything here runs against Release, including the OpenWatcom sample suite,
# so the binary that is tested is the binary that ships. Note that the sample
# baseline in tests/baselines was recorded on Debug under the pre-Task-429
# criterion; the harness warns about both differences, and the first run is
# expected to report regressions that are measurement corrections. Its report
# artifact is what the re-recording decision is made from.
#
# Task 767: the Linux i386 and x64 archives build alongside, and one publish
# job attaches every platform's archive once all of them are green.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Version gate
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Version gate
        id: version
        # AGENTS.md requires VERSION and the tag to agree. That rule is kept by
        # hand, so a machine checks it before anything expensive runs. Task 767
        # moved it into a job of its own so every build job reads one value.
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::VERSION must use major.minor.patch format, found '$version'."
              exit 1
          fi
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
              tag="${{ github.ref_name }}"
              if [[ "${tag#v}" != "$version" ]]; then
                  echo "::error::VERSION file and tag disagree."
                  echo "  VERSION file : $version"
                  echo "  tag          : $tag (reads as ${tag#v})"
                  exit 1
              fi
              echo "Tag $tag matches VERSION $version."
          else
              # workflow_dispatch has no tag to compare against.
              echo "Manual run; using VERSION $version without a tag comparison."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  win32:
    name: Win32 Release build, sample suite, artifacts
    needs: version
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore FetchContent dependency cache
        uses: actions/cache@v4
        with:
          path: build/win32_x86_debug/_deps
          key: deps-windows-2022-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            deps-windows-2022-

      - name: Restore OpenWatcom download cache
        uses: actions/cache@v4
        with:
          # The pinned SHA256 lives in the install script, so its hash is the
          # right key: a new pin invalidates the cached archive.
          path: tools/downloads
          key: openwatcom-${{ hashFiles('scripts/install_openwatcom.ps1') }}

      - name: Build (Release)
        shell: powershell
        run: .\scripts\build_win32_x86.ps1 -Configuration Release

      - name: Probe - Glide implementation issue tracker
        shell: powershell
        run: .\build\win32_x86_debug\Release\repiu_glide_issue_probe.exe

      - name: Probe - AOT timer safe point
        shell: powershell
        run: .\build\win32_x86_debug\Release\repiu_aot_probe.exe --timer-safe-point

      - name: Install OpenWatcom
        shell: powershell
        run: .\scripts\install_openwatcom.ps1

      - name: Build OpenWatcom samples
        shell: powershell
        # -SkipHostBuild because the Release loader is already built above.
        # -SkipSetup is deliberately not passed: with a warm cache the installer
        # returns immediately, and with a cold one this path self-heals.
        run: .\scripts\build_openwatcom_samples.ps1 -Configuration Release -SkipHostBuild

      - name: Test OpenWatcom samples against the baseline
        shell: powershell
        run: .\scripts\test_openwatcom_samples.ps1 -Configuration Release -CompareBaseline

      - name: Package
        # always(): a run that failed on regressions is exactly when the sample
        # report is wanted, so package and upload it either way.
        if: always() && needs.version.outputs.version != ''
        shell: powershell
        run: |
          .\scripts\package_release.ps1 `
              -Configuration Release `
              -Version ${{ needs.version.outputs.version }} `
              -AllowMissingSampleReport

      - name: Upload artifacts
        if: always() && needs.version.outputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: rePIU-v${{ needs.version.outputs.version }}
          path: build/package/*.zip
          if-no-files-found: warn
          retention-days: 30

  linux:
    # Task 767. ubuntu-22.04 is pinned for the glibc it builds against (2.35):
    # the archive runs there and on anything newer, and a floating image would
    # silently raise that floor.
    name: Linux ${{ matrix.arch }} Release build, probes, archive
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [i386, x64]
    env:
      BUILD_DIR: build/linux_${{ matrix.arch }}_release

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install build packages
        # SDL builds the desktop and audio drivers it finds at configure time
        # and loads their libraries at run time, so these are development
        # headers only; the archive carries none of them.
        run: |
          if [[ "${{ matrix.arch }}" == "i386" ]]; then
              sudo dpkg --add-architecture i386
              suffix=":i386"
              extra="gcc-multilib g++-multilib libc6-dev-i386"
          else
              suffix=""
              extra=""
          fi
          libs="libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev
                libxi-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev
                libwayland-dev libdecor-0-dev libpulse-dev libasound2-dev
                libdbus-1-dev libudev-dev"
          packages="pkg-config libwayland-bin wayland-protocols $extra"
          for lib in $libs; do
              packages="$packages ${lib}${suffix}"
          done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $packages

      - name: Build (Release, static C++ runtime)
        run: >-
          bash scripts/build_linux_${{ matrix.arch }}.sh
          --config Release --static-runtime --build-dir "$BUILD_DIR"

      - name: Check SDL's desktop and audio drivers
        # The build scripts only warn when a 32-bit development package is
        # missing, and the binary then runs silent or with no title bar under
        # Wayland. A release must not ship that, so here it fails the job.
        run: |
          config="$(find "$BUILD_DIR/_deps/sdl3-build" -name SDL_build_config.h | head -1)"
          if [[ -z "$config" ]]; then
              echo "::error::SDL_build_config.h not found under $BUILD_DIR."
              exit 1
          fi
          missing=0
          for define in SDL_VIDEO_DRIVER_X11 SDL_VIDEO_DRIVER_WAYLAND HAVE_LIBDECOR_H \
                        SDL_AUDIO_DRIVER_PULSEAUDIO SDL_AUDIO_DRIVER_ALSA; do
              if grep -qE "^#define ${define}( |$)" "$config"; then
                  echo "found   $define"
              else
                  echo "::error::SDL was configured without $define."
                  missing=1
              fi
          done
          exit $missing

      - name: Check the runtime the binaries need
        # No dynamic libstdc++, and no glibc symbol newer than the runner's.
        run: |
          status=0
          for binary in repiu repiu_launcher; do
              path="$BUILD_DIR/$binary"
              if readelf -d "$path" | grep -qE "NEEDED.*libstdc\+\+"; then
                  echo "::error::$binary links libstdc++ dynamically."
                  status=1
              fi
              newest="$(objdump -T "$path" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)"
              echo "$binary: newest glibc symbol $newest"
              if [[ "$(printf '%s\nGLIBC_2.35\n' "$newest" | sort -V | tail -1)" != "GLIBC_2.35" ]]; then
                  echo "::error::$binary needs $newest, newer than the 2.35 floor."
                  status=1
              fi
              readelf -d "$path" | grep NEEDED
          done
          exit $status

      - name: Probe - core contracts
        run: ./$BUILD_DIR/repiu_core_probe

      - name: Probe - Glide implementation issue tracker
        run: ./$BUILD_DIR/repiu_glide_issue_probe

      - name: Package
        run: >-
          bash scripts/package_release_linux.sh ${{ matrix.arch }}
          --build-dir "$BUILD_DIR" --version ${{ needs.version.outputs.version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rePIU-v${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}
          path: build/package/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    # Task 767: publishing moved out of the Win32 job so the release is created
    # once, after every platform has built. Only a green tag run publishes; a
    # manual run leaves its artifacts on the workflow run and creates no release.
    name: Attach to the GitHub release
    needs: [version, win32, linux]
    if: success() && github.ref_type == 'tag'
    runs-on: ubuntu-22.04

    steps:
      - name: Check out
        # For the hand-written release notes.
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rePIU-v${{ needs.version.outputs.version }}*
          path: dist
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          version="${{ needs.version.outputs.version }}"
          ls -l dist

          # A release must carry every platform and its test evidence.
          required=(
              "rePIU-v$version-win32.zip"
              "rePIU-v$version-linux-i386.tar.gz"
              "rePIU-v$version-linux-x64.tar.gz"
              "openwatcom-samples-v$version.zip"
          )
          for file in "${required[@]}"; do
              if [[ ! -f "dist/$file" ]]; then
                  echo "::error::Refusing to publish $tag without $file."
                  exit 1
              fi
          done
          files=("${required[@]/#/dist/}")

          # Task 448: hand-written notes when the tag has them. Generated notes
          # list commit subjects, which says what changed but not what it means
          # to someone downloading the archive.
          notes="docs/release-notes/$tag.md"
          if [[ -f "$notes" ]]; then
              echo "Using release notes from $notes."
              notes_arguments=(--notes-file "$notes")
          else
              echo "No $notes; falling back to generated notes."
              notes_arguments=(--generate-notes)
          fi

          if gh release view "$tag" > /dev/null 2>&1; then
              echo "Release $tag exists; uploading with --clobber."
              gh release upload "$tag" "${files[@]}" --clobber
              if [[ -f "$notes" ]]; then
                  gh release edit "$tag" --notes-file "$notes"
              fi
          else
              echo "Creating release $tag."
              gh release create "$tag" "${files[@]}" --title "$tag" "${notes_arguments[@]}"
          fi
