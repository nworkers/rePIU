name: Pages

# Task 756: builds the project site from docs/sites/ and deploys it to GitHub Pages.
#
# The Pages source must be set to "GitHub Actions" (Settings -> Pages). Deploying
# from a branch's /docs folder instead would publish every internal document there.
#
# release.yml creates releases with GITHUB_TOKEN, and events caused by that token
# start no other workflow, so `on: release` would never fire. The download page is
# refreshed by chaining on the Release workflow instead.
on:
  push:
    branches: [main]
    paths:
      - 'docs/sites/**'
      - 'docs/post/**'
      - 'docs/release-notes/**'
      - 'scripts/site/**'
      - 'src/target/target_profile.cpp'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/sites/**'
      - 'docs/post/**'
      - 'docs/release-notes/**'
      - 'scripts/site/**'
      - 'src/target/target_profile.cpp'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  # A deployment in progress is allowed to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    # A failed or manual-without-tag Release run has nothing new to show.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/site/requirements.txt

      - name: Install build dependencies
        run: python -m pip install -r scripts/site/requirements.txt

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build
        env:
          # Read-only use: the release list, asset sizes and digests.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          site_url='${{ steps.pages.outputs.base_url }}'
          python scripts/site/build_site.py --out build/site ${site_url:+--site-url "$site_url/"}

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
