[hero]
command = "repiu.exe"
tagline = "The original DOS/4G game code, as it is, on a modern PC."
lead = "rePIU is an experimental runtime that executes the original 32-bit x86 code of DOS/4G-based PIU binaries natively, without DOSBox or a full PC emulator. Game logic stays in the original code; only the DOS, DPMI, memory, file-system and hardware boundaries are replaced with High Level Emulation (HLE)."
latest = "Latest"
cta_download = "Download"
cta_wip = "See progress"
warning = "This is research-stage software, not a finished game launcher. Per-title compatibility is still under development."

[about]
title = "Principles"
items = [
  "<strong>Original logic preserved</strong> — gameplay is not rewritten in C++; the original x86 code stays the primary execution path.",
  "<strong>Selective HLE</strong> — only the observed DOS interrupts, DPMI, port I/O and memory behaviour are replaced, narrowly.",
  "<strong>DOS/4GW LE analysis</strong> — executable objects, fixups, relocations and runtime image placement are handled directly.",
  "<strong>Replaceable parts</strong> — loader, memory, selectors, DOS file system and HLE profiles are kept apart.",
  "<strong>Reproducible records</strong> — designs, work orders, analysis and work logs accumulate as repository documents.",
]

[how]
title = "How it works"
body = [
  "The loader reads the original LE executable, applies its fixups and places it in memory; the original code then runs on the host CPU as it is.",
  "Only when that code reaches a DOS or DPMI call, a privileged instruction or a hardware port does the HLE layer step in, answering from a virtual DOS file system, a memory arena with selectors, and interrupt and port I/O services, then hand control back to the original code.",
]

[targets]
title = "Supported ROM sets"
lead = "The MAME-format PIU profiles in the current built-in catalog. Each needs its matching ROM ZIP and CHD, legally owned by the user. Per-title compatibility is still under development."
