lead = "rePIU는 DOSBox나 전체 PC 에뮬레이터를 쓰지 않고, 원본 DOS/4G 기반 PIU 실행 파일의 32비트 x86 코드를 네이티브로 실행하는 실험적 런타임입니다. 게임 로직은 원본 코드에 그대로 두고 DOS, DPMI, 메모리, 파일 시스템, 하드웨어 경계만 High Level Emulation(HLE)으로 대신합니다."
