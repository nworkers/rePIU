[about]
title = "원칙"
items = [
  "<strong>원본 로직 보존</strong> — 게임플레이를 C++로 다시 쓰지 않고 원본 x86 코드를 주 실행 경로로 유지합니다.",
  "<strong>선별적 HLE</strong> — 관찰된 DOS interrupt, DPMI, port I/O와 메모리 동작만 좁은 범위로 대체합니다.",
  "<strong>DOS/4GW LE 분석</strong> — executable object, fixup, relocation과 runtime image 배치를 직접 다룹니다.",
  "<strong>교체 가능한 구조</strong> — loader, 메모리, selector, DOS 파일 시스템, HLE profile을 서로 분리합니다.",
  "<strong>재현 가능한 기록</strong> — 설계, 작업 지시, 분석과 작업 로그를 저장소 문서로 누적합니다.",
]

[how]
title = "동작 방식"
body = [
  "로더가 원본 LE 실행 파일을 읽어 fixup을 적용하고 메모리에 배치하면, 원본 코드는 호스트 CPU에서 그대로 실행됩니다.",
  "코드가 DOS·DPMI 호출이나 특권 명령, 하드웨어 port에 닿는 순간에만 HLE 계층이 가로채 가상 DOS 파일 시스템, 메모리 arena와 selector, interrupt·port I/O 서비스로 응답한 뒤 원본 코드로 돌려보냅니다.",
]

