{#- The five Pump It Up panels (Task 764): down-left, up-left, centre, up-right,
    down-right. One pixel-art up-right arrow, mirrored into the other corners. -#}
{%- macro arrow() -%}
<rect x="6" y="2" width="8" height="2"/><rect x="8" y="4" width="6" height="2"/><rect x="10" y="6" width="4" height="2"/><rect x="12" y="8" width="2" height="2"/><rect x="8" y="6" width="2" height="2"/><rect x="6" y="8" width="4" height="2"/><rect x="4" y="10" width="4" height="2"/><rect x="2" y="12" width="4" height="2"/>
{%- endmacro -%}
<p class="padline" aria-hidden="true">
  <svg viewBox="0 0 16 16" shape-rendering="crispEdges" class="pad--down"><g transform="translate(16 16) scale(-1 -1)">{{ arrow() }}</g></svg>
  <svg viewBox="0 0 16 16" shape-rendering="crispEdges" class="pad--up"><g transform="translate(16 0) scale(-1 1)">{{ arrow() }}</g></svg>
  <svg viewBox="0 0 16 16" shape-rendering="crispEdges" class="pad--center"><rect x="5" y="2" width="6" height="2"/><rect x="3" y="4" width="10" height="2"/><rect x="2" y="6" width="12" height="4"/><rect x="3" y="10" width="10" height="2"/><rect x="5" y="12" width="6" height="2"/></svg>
  <svg viewBox="0 0 16 16" shape-rendering="crispEdges" class="pad--up">{{ arrow() }}</svg>
  <svg viewBox="0 0 16 16" shape-rendering="crispEdges" class="pad--down"><g transform="translate(0 16) scale(1 -1)">{{ arrow() }}</g></svg>
</p>
